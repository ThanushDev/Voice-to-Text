<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCBS Turbo Transcribe | Digi Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #030712;
            --primary: #6366f1;
            --danger: #ef4444;
            --success: #10b981;
            --card: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: var(--bg); color: #f8fafc;
            font-family: 'Inter', sans-serif; display: flex; justify-content: center;
            min-height: 100vh;
        }

        .container { width: 95%; max-width: 800px; padding: 40px 10px; }

        .glass-card {
            background: var(--card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .header h1 { font-size: 28px; margin: 0; font-weight: 900; letter-spacing: -1px; }
        .gradient-text { background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Output Box */
        #display-container {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            border-radius: 18px; padding: 20px; min-height: 350px; max-height: 500px;
            margin: 25px 0; overflow-y: auto; font-size: 19px; line-height: 1.7;
            white-space: pre-wrap; position: relative;
        }

        .interim-text { color: #818cf8; opacity: 0.8; font-style: italic; }

        /* Controls Grid */
        .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; }

        .btn {
            padding: 15px; border-radius: 14px; border: none; font-weight: 700;
            cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }
        .btn-pdf { background: var(--success); }
        .btn-clear { background: #334155; }
        .btn-edit { background: #1e293b; }

        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn:active { transform: scale(0.95); }

        .status-bar { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .recording-pulse { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: inline-block; animation: pulse 1s infinite; margin-right: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        footer { text-align: center; margin-top: 30px; font-size: 11px; color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="header">
            <h1>FCBS <span class="gradient-text">Turbo Transcribe</span></h1>
            <p style="font-size: 12px; color: #64748b; margin: 5px 0;">DIGI SOLUTIONS | HIGH-SPEED ENGINE V2.0</p>
        </div>

        <div class="status-bar">
            <span id="status">Status: Idle</span>
            <span id="mode">Mode: Precision</span>
        </div>

        <div id="display-container" contenteditable="false">Your transcript will appear here. Press Start...</div>

        <div class="grid">
            <button id="main-btn" class="btn btn-start" onclick="toggleRecording()">
                <span id="icon">🎤</span> <span id="btn-text">Start</span>
            </button>
            <button class="btn btn-edit" onclick="toggleEdit()">✏️ Edit</button>
            <button class="btn btn-clear" onclick="clearAll()">🗑️ Clear</button>
            <button class="btn btn-pdf" onclick="exportPDF()">📄 PDF</button>
        </div>
    </div>
    <footer>© 2026 Digi Solutions | Developed for FCBS IS Students</footer>
</div>

<script>
    let recognition;
    let isRecording = false;
    let isEditing = false;
    let final_script = "";

    if (!('webkitSpeechRecognition' in window)) {
        alert("Mchn, use Chrome for the best experience!");
    } else {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            document.getElementById('status').innerHTML = `<span class="recording-pulse"></span> RECORDING LIVE`;
        };

        recognition.onresult = (event) => {
            let interim_script = "";
            
            // We rebuild the view from the results list to prevent duplication
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcript = event.results[i][0].transcript;
                // Accuracy check: Only accept if the engine is reasonably sure
                if (event.results[i].isFinal) {
                    final_script += transcript + " ";
                } else {
                    interim_script += transcript;
                }
            }

            const box = document.getElementById('display-container');
            box.innerHTML = final_script + `<span class="interim-text">${interim_script}</span>`;
            box.scrollTop = box.scrollHeight;
        };

        recognition.onend = () => {
            if (isRecording) {
                recognition.start(); // Auto-restart for continuous lectures
            } else {
                document.getElementById('status').innerText = "Status: Stopped";
            }
        };

        recognition.onerror = (e) => {
            console.error("Error:", e.error);
            if (e.error === 'network') alert("Network error! Check your connection.");
        };
    }

    function toggleRecording() {
        const btn = document.getElementById('main-btn');
        const box = document.getElementById('display-container');

        if (!isRecording) {
            isRecording = true;
            if (final_script === "") box.innerText = "";
            recognition.start();
            btn.className = "btn btn-stop";
            document.getElementById('btn-text').innerText = "Stop";
            document.getElementById('icon').innerText = "🛑";
        } else {
            isRecording = false;
            recognition.stop();
            btn.className = "btn btn-start";
            document.getElementById('btn-text').innerText = "Start";
            document.getElementById('icon').innerText = "🎤";
        }
    }

    function toggleEdit() {
        const box = document.getElementById('display-container');
        isEditing = !isEditing;
        box.contentEditable = isEditing;
        
        if (isEditing) {
            box.style.borderColor = "#6366f1";
            box.focus();
        } else {
            box.style.borderColor = "rgba(255,255,255,0.1)";
            final_script = box.innerText + " "; // Sync edits back to engine
        }
    }

    function clearAll() {
        if (confirm("Are you sure you want to clear the text?")) {
            final_script = "";
            document.getElementById('display-container').innerHTML = "";
        }
    }

    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const content = document.getElementById('display-container').innerText;

        doc.setFont("helvetica", "bold");
        doc.text("FCBS LECTURE NOTES", 20, 20);
        doc.setFontSize(10);
        doc.text("Date: " + new Date().toLocaleString(), 20, 30);
        doc.line(20, 35, 190, 35);
        
        doc.setFont("helvetica", "normal");
        const splitText = doc.splitTextToSize(content, 170);
        doc.text(splitText, 20, 45);
        doc.save("FCBS_Notes.pdf");
    }
</script>

</body>
</html>
