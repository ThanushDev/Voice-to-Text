<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCBS Live Transcribe | Real-Time Typing</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #030712;
            --card: rgba(17, 24, 39, 0.7);
            --primary: #818cf8;
            --accent: #c084fc;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; background: var(--bg); color: #f3f4f6;
            font-family: 'Inter', sans-serif; display: flex; justify-content: center;
        }

        .container { width: 95%; max-width: 800px; padding: 40px 10px; }

        .glass-card {
            background: var(--card); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 28px;
            padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 900; font-size: 30px;
        }

        /* Voice Meter */
        .visualizer-box {
            margin: 20px 0; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px;
        }
        .bar-bg { height: 12px; background: #1f2937; border-radius: 6px; overflow: hidden; }
        #bar-fill { 
            height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #a855f7);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.6); transition: width 0.05s;
        }

        /* Typing Box */
        .type-area {
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; min-height: 380px;
            font-size: 20px; line-height: 1.8; color: #e5e7eb;
            max-height: 500px; overflow-y: auto; white-space: pre-wrap;
            position: relative;
        }

        /* The Live "Typing" Cursor Effect */
        .interim-live {
            color: var(--primary);
            border-right: 3px solid var(--primary);
            animation: blink 0.7s infinite;
            padding-right: 2px;
            font-style: italic;
        }

        @keyframes blink { 0%, 100% { border-color: transparent; } 50% { border-color: var(--primary); } }

        .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 25px; }
        .btn {
            padding: 18px; border-radius: 16px; border: none; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; font-size: 14px;
        }
        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: #ef4444; color: white; }
        .btn-util { background: #374151; color: white; }
        .btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        .status { font-size: 12px; color: #9ca3af; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <div style="margin-bottom: 20px;">
                <span class="gradient-text">FCBS LIVE TYPING</span>
                <p style="color: #6b7280; font-size: 13px; margin: 5px 0;">1000% Sensitive | Instant Transcription</p>
            </div>

            <div class="visualizer-box">
                <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:8px; font-weight:800;">
                    <span>VOICE POWER</span>
                    <span id="vol-num">0%</span>
                </div>
                <div class="bar-bg"><div id="bar-fill"></div></div>
            </div>

            <div id="transcript" class="type-area" contenteditable="false">Press Start and speak...</div>

            <div class="controls">
                <button id="main-btn" class="btn btn-start" onclick="toggleEngine()">
                    <span id="btn-icon">🎤</span> <span id="btn-text">Start Session</span>
                </button>
                <button class="btn btn-util" onclick="exportToPDF()">📄 PDF</button>
                <button class="btn btn-util" style="background:#1f2937" onclick="clearAll()">🗑️</button>
            </div>
            
            <div class="status" id="status-msg">Status: WAITING</div>
        </div>
        <div style="text-align: center; margin-top: 20px; color: #4b5563; font-size: 11px;">DIGI SOLUTIONS PRO</div>
    </div>

    <script>
        let recognition;
        let isRecording = false;
        let final_text = "";
        let audioCtx, analyser, microphone, gainNode;

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; // MEKA THAMAI REAL-TIME TYPING KARANNE

            recognition.onresult = (event) => {
                let interim_text = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final_text += event.results[i][0].transcript + " ";
                    } else {
                        interim_text += event.results[i][0].transcript;
                    }
                }
                
                const box = document.getElementById('transcript');
                // Real-time "Typing" display
                box.innerHTML = final_text + '<span class="interim-live">' + interim_text + '</span>';
                box.scrollTop = box.scrollHeight;
            };

            recognition.onend = () => { if (isRecording) recognition.start(); };
        }

        async function toggleEngine() {
            const btn = document.getElementById('main-btn');
            const status = document.getElementById('status-msg');

            if (!isRecording) {
                try {
                    // 1000% Sensitivity Boost
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new AudioContext();
                    analyser = audioCtx.createAnalyser();
                    microphone = audioCtx.createMediaStreamSource(stream);
                    gainNode = audioCtx.createGain();
                    
                    gainNode.gain.value = 18; // Massive gain boost
                    microphone.connect(gainNode);
                    gainNode.connect(analyser);
                    
                    startVisualizer();

                    if(final_text === "" || document.getElementById('transcript').innerText.includes("Press Start")) {
                        final_text = "";
                    }

                    recognition.start();
                    isRecording = true;
                    btn.className = "btn btn-stop";
                    document.getElementById('btn-icon').innerText = "🛑";
                    document.getElementById('btn-text').innerText = "Stop Session";
                    status.innerText = "Status: TYPING LIVE...";
                } catch (e) { alert("Microphone access needed!"); }
            } else {
                stopEngine();
            }
        }

        function stopEngine() {
            isRecording = false;
            recognition.stop();
            if (audioCtx) audioCtx.close();
            document.getElementById('main-btn').className = "btn btn-start";
            document.getElementById('btn-icon').innerText = "🎤";
            document.getElementById('btn-text').innerText = "Start Session";
            document.getElementById('status-msg').innerText = "Status: STOPPED";
            document.getElementById('bar-fill').style.width = "0%";
        }

        function startVisualizer() {
            const data = new Uint8Array(analyser.frequencyBinCount);
            const loop = () => {
                if (!isRecording) return;
                analyser.getByteFrequencyData(data);
                let sum = data.reduce((a, b) => a + b, 0);
                let vol = Math.round(Math.min((sum / data.length) * 4, 100));
                document.getElementById('bar-fill').style.width = vol + "%";
                document.getElementById('vol-num').innerText = vol + "%";
                requestAnimationFrame(loop);
            };
            loop();
        }

        function clearAll() {
            if(confirm("මකන්නද?")) {
                final_text = "";
                document.getElementById('transcript').innerHTML = "Press Start and speak...";
            }
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById('transcript').innerText;
            if(text.length < 5) return;

            doc.setFontSize(22);
            doc.setTextColor(129, 140, 248);
            doc.text("FCBS LECTURE NOTE", 20, 20);
            
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text("Date: " + new Date().toLocaleString(), 20, 28);
            doc.line(20, 32, 190, 32);

            doc.setFontSize(12);
            doc.setTextColor(0);
            const splitLines = doc.splitTextToSize(text, 170);
            doc.text(splitLines, 20, 42);
            doc.save("FCBS_Live_Note.pdf");
        }
    </script>
</body>
</html>
