<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCBS Studio Transcribe | Ultra Sensitive Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #020617;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --accent: #a855f7;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; background-color: var(--bg); color: var(--text-main);
            font-family: 'Inter', sans-serif; display: flex; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .blob {
            position: fixed; width: 400px; height: 400px; background: var(--primary);
            filter: blur(140px); opacity: 0.12; z-index: -1; border-radius: 50%;
        }

        .container {
            width: 95%; max-width: 750px; padding: 40px 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .glass-card {
            background: var(--card); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 35px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        .header h1 { font-size: 30px; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Sensitivity Meter */
        .sensitivity-panel {
            background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px 15px;
            margin: 15px 0; border: 1px solid var(--border); width: 100%;
        }
        .meter-container { height: 6px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        #meter-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s; }

        .output-container { position: relative; margin: 20px 0; }
        
        #transcript {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; min-height: 300px;
            font-size: 18px; line-height: 1.8; color: #e2e8f0;
            outline: none; max-height: 500px; overflow-y: auto; white-space: pre-wrap;
        }

        .controls-grid { 
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; width: 100%; 
        }

        .btn {
            padding: 16px 8px; border-radius: 16px; border: none; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 6px; transition: 0.3s; color: white; font-size: 14px;
        }

        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }
        .btn-utility { background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
        .btn-pdf { background: #10b981; }

        .pulse-icon {
            width: 10px; height: 10px; background: #ef4444; border-radius: 50%;
            display: inline-block; margin-right: 8px; animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        @media (max-width: 650px) {
            .controls-grid { grid-template-columns: 1fr 1fr; }
            .btn-start, .btn-stop { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="blob" style="top: -10%; left: -10%;"></div>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h1>FCBS <span class="gradient-text">Pro Transcribe</span></h1>
                <p style="font-size: 13px; color: var(--text-dim); margin-top: 5px;">Ultra Sensitive Mode | DIGI SOLUTIONS</p>
            </div>

            <!-- Sensitivity Visualizer -->
            <div class="sensitivity-panel">
                <div style="display:flex; justify-content:space-between; font-size:11px;">
                    <span>VOICE INPUT STRENGTH</span>
                    <span id="vol-value">0%</span>
                </div>
                <div class="meter-container"><div id="meter-fill"></div></div>
            </div>

            <div class="output-container">
                <div id="transcript" contenteditable="false">Your session text will appear here. Press Start...</div>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:15px;">
                <div id="status-text">Status: IDLE</div>
                <div>DIGI SOLUTIONS</div>
            </div>

            <div class="controls-grid">
                <button id="main-btn" class="btn btn-start" onclick="handleMainAction()">
                    <span id="btn-icon">🎤</span> <span id="btn-text">Start Session</span>
                </button>
                <button class="btn btn-utility" onclick="toggleEdit()">
                    <span id="edit-icon">✏️</span> <span id="edit-text">Edit</span>
                </button>
                <button class="btn btn-pdf" onclick="saveAsPDF()">📄 PDF</button>
                <button class="btn btn-utility" style="color:var(--danger)" onclick="clearTranscript()">🗑️ Clear</button>
            </div>
        </div>
        <footer style="margin-top:20px; color:#475569; font-size:12px;">DEVELOPED BY MR.THANUSH &copy; 2026</footer>
    </div>

    <script>
        let recognition;
        let isRecording = false;
        let final_transcript = ""; 
        let audioContext, analyser, microphone, scriptNode;

        // Initialize Speech Engine
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; 

            recognition.onresult = (event) => {
                let interim_transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final_transcript += event.results[i][0].transcript + " ";
                    } else {
                        interim_transcript += event.results[i][0].transcript;
                    }
                }
                document.getElementById('transcript').innerHTML = 
                    final_transcript + '<span style="color: #818cf8; opacity: 0.9">' + interim_transcript + '</span>';
                
                const box = document.getElementById('transcript');
                box.scrollTop = box.scrollHeight;
            };

            recognition.onend = () => { if (isRecording) recognition.start(); };
        }

        // 1000% Gain & Visualizer Logic
        async function startAudioBoost() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                // Gain Node to amplify silent voice
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 10; // Boosted 10 times

                scriptNode = audioContext.createScriptProcessor(2048, 1, 1);
                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;

                microphone.connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(scriptNode);
                scriptNode.connect(audioContext.destination);

                scriptNode.onaudioprocess = () => {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;
                    for (let i = 0; i < array.length; i++) values += array[i];
                    let average = (values / array.length);
                    let volume = Math.round(Math.min(average * 2, 100));
                    document.getElementById('meter-fill').style.width = volume + "%";
                    document.getElementById('vol-value').innerText = volume + "%";
                };
            } catch (err) {
                console.error("Mic gain failed:", err);
            }
        }

        function handleMainAction() {
            if (!isRecording) {
                isRecording = true;
                if(final_transcript.trim() === "" || document.getElementById('transcript').innerText.includes("Press Start")) {
                    document.getElementById('transcript').innerText = "";
                }
                recognition.start();
                startAudioBoost();
                document.getElementById('main-btn').className = "btn btn-stop";
                document.getElementById('btn-text').innerText = "Stop Session";
                document.getElementById('btn-icon').innerText = "🛑";
                document.getElementById('status-text').innerHTML = `<span class="pulse-icon"></span> LISTENING (MAX SENSITIVE)`;
            } else {
                isRecording = false;
                recognition.stop();
                if (audioContext) audioContext.close();
                document.getElementById('main-btn').className = "btn btn-start";
                document.getElementById('btn-text').innerText = "Start Session";
                document.getElementById('btn-icon').innerText = "🎤";
                document.getElementById('status-text').innerText = "Status: STOPPED";
                document.getElementById('meter-fill').style.width = "0%";
            }
        }

        function toggleEdit() {
            const div = document.getElementById('transcript');
            div.contentEditable = (div.contentEditable === 'false');
            div.style.background = (div.contentEditable === 'true') ? "rgba(99, 102, 241, 0.05)" : "rgba(0,0,0,0.4)";
            if(div.contentEditable === 'false') final_transcript = div.innerText.trim() + " ";
        }

        function clearTranscript() {
            if (confirm("Clear notes?")) {
                final_transcript = "";
                document.getElementById('transcript').innerText = "Your session text will appear here. Press Start...";
            }
        }

        function saveAsPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const text = document.getElementById('transcript').innerText;
            if(!text || text.includes("Press Start")) return;
            doc.setFontSize(20);
            doc.setTextColor(99, 102, 241);
            doc.text("Lecture Note", 20, 20);
            doc.setFontSize(12);
            doc.setTextColor(0);
            const lines = doc.splitTextToSize(text, 170);
            doc.text(lines, 20, 40);
            doc.save("FCBS_Lecture_Note.pdf");
        }
    </script>
</body>
</html>
