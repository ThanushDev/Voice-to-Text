<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCBS Studio Pro | Real-Time Transcribe</title>
    
    <!-- Fonts & PDF Library -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #020617;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --accent: #a855f7;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; background-color: var(--bg); color: var(--text-main);
            font-family: 'Inter', sans-serif; display: flex; justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 95%; max-width: 800px; padding: 40px 15px;
            display: flex; flex-direction: column;
        }

        .glass-card {
            background: var(--card); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .header { margin-bottom: 20px; }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800; font-size: 28px;
        }

        /* Live Indicator */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; margin-bottom: 10px; color: var(--text-dim);
        }
        .recording-pulse {
            width: 10px; height: 10px; background: #ef4444; border-radius: 50%;
            display: inline-block; margin-right: 5px; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Output Box */
        .output-container {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; min-height: 380px;
            position: relative; overflow: hidden;
        }
        #transcript {
            font-size: 18px; line-height: 1.8; color: #e2e8f0; outline: none;
            max-height: 450px; overflow-y: auto; white-space: pre-wrap;
        }

        /* Buttons */
        .controls { 
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-top: 25px; 
        }
        .btn {
            padding: 15px 5px; border-radius: 12px; border: none; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: 0.2s; color: white; font-size: 13px;
        }
        .btn-start { background: var(--primary); }
        .btn-stop { background: #ef4444; }
        .btn-pdf { background: #10b981; }
        .btn-util { background: rgba(255,255,255,0.05); border: 1px solid var(--border); }

        .interim-text { color: #a855f7; font-style: italic; font-weight: 500; }

        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr 1fr; }
            .btn-start, .btn-stop { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <div class="header">
                <span class="gradient-text">FCBS Studio Pro</span>
                <p style="color: var(--text-dim); font-size: 12px; margin: 5px 0 0 0;">Visual Sync Mode | 2026 Edition</p>
            </div>

            <div class="status-bar">
                <div id="status-label">Status: IDLE</div>
                <div id="lang-indicator">English (US)</div>
            </div>

            <div class="output-container">
                <div id="transcript" contenteditable="false">Your words will appear here the moment you speak. Press 'Start'...</div>
            </div>

            <div class="controls">
                <button id="main-btn" class="btn btn-start" onclick="toggleRecording()">
                    <span id="btn-icon">🎤</span> <span id="btn-text">Start Recording</span>
                </button>
                <button class="btn btn-util" onclick="toggleEdit()" id="edit-btn">✏️ Edit</button>
                <button class="btn btn-pdf" onclick="savePDF()">📄 PDF</button>
                <button class="btn btn-util" style="color: #ef4444" onclick="clearText()">🗑️ Clear</button>
            </div>
        </div>
        <footer style="text-align: center; margin-top: 20px; font-size: 11px; color: #475569;">
            DIGI SOLUTIONS &copy; | DEVELOPED BY MR.THANUSH
        </footer>
    </div>

    <script>
        let recognition;
        let isRecording = false;
        let isEditing = false;
        let final_transcript = "";

        // Web Speech API Initialization
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; // MEKA THAMAI REAL-TIME TYPE KARANNE

            recognition.onresult = (event) => {
                let interim_transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final_transcript += event.results[i][0].transcript + " ";
                    } else {
                        interim_transcript += event.results[i][0].transcript;
                    }
                }
                
                // Real-time Update
                const box = document.getElementById('transcript');
                box.innerHTML = final_transcript + '<span class="interim-text">' + interim_transcript + '</span>';
                box.scrollTop = box.scrollHeight; // Auto Scroll
            };

            recognition.onstart = () => {
                document.getElementById('status-label').innerHTML = '<span class="recording-pulse"></span> RECORDING LIVE';
            };

            recognition.onend = () => {
                if (isRecording) recognition.start(); // Auto-restart if browser stops
            };
        }

        function toggleRecording() {
            const btn = document.getElementById('main-btn');
            const icon = document.getElementById('btn-icon');
            const text = document.getElementById('btn-text');

            if (!isRecording) {
                isRecording = true;
                if(final_transcript === "" || document.getElementById('transcript').innerText.includes("Your words will")) {
                    document.getElementById('transcript').innerHTML = "";
                    final_transcript = "";
                }
                recognition.start();
                btn.className = "btn btn-stop";
                icon.innerText = "🛑";
                text.innerText = "Stop Session";
            } else {
                isRecording = false;
                recognition.stop();
                btn.className = "btn btn-start";
                icon.innerText = "🎤";
                text.innerText = "Start Recording";
                document.getElementById('status-label').innerText = "Status: STOPPED";
            }
        }

        function toggleEdit() {
            const box = document.getElementById('transcript');
            const btn = document.getElementById('edit-btn');
            isEditing = !isEditing;
            box.contentEditable = isEditing;
            
            if (isEditing) {
                btn.innerHTML = "💾 Save";
                box.style.border = "1px solid var(--primary)";
            } else {
                btn.innerHTML = "✏️ Edit";
                box.style.border = "1px solid var(--border)";
                final_transcript = box.innerText + " ";
            }
        }

        function clearText() {
            if(confirm("මොකද කියන්නේ? ඔක්කොම මකන්නද?")) {
                final_transcript = "";
                document.getElementById('transcript').innerHTML = "Your words will appear here the moment you speak. Press 'Start'...";
            }
        }

        function savePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const content = document.getElementById('transcript').innerText;

            if(!content || content.includes("Your words will")) {
                alert("Mchn, empty file එකක් download කරන්න බෑනේ!");
                return;
            }

            doc.setFontSize(22);
            doc.setTextColor(99, 102, 241);
            doc.text("FCBS Lecture Transcript", 15, 20);
            
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text("Generated: " + new Date().toLocaleString(), 15, 28);
            
            doc.line(15, 32, 195, 32);

            doc.setFontSize(12);
            doc.setTextColor(0);
            const lines = doc.splitTextToSize(content, 180);
            doc.text(lines, 15, 42);
            
            doc.save("FCBS_Lecture_Note.pdf");
        }
    </script>
</body>
</html>
