<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCBS Studio Ultra | 1000% Sensitivity</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --primary: #6366f1;
            --danger: #ef4444;
            --text: #ffffff;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; display: flex; justify-content: center;
        }

        .container { width: 95%; max-width: 800px; padding: 30px 10px; }

        .main-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 25px; box-shadow: 0 0 40px rgba(99, 102, 241, 0.1);
        }

        /* Power Meter */
        .meter-box {
            background: #0a0a0a; border: 1px solid #1f2937; border-radius: 15px;
            padding: 15px; margin: 20px 0;
        }
        .bar-outer { height: 14px; background: #111827; border-radius: 7px; overflow: hidden; }
        #bar-inner { 
            height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.05s ease-out; box-shadow: 0 0 15px var(--primary);
        }

        /* Transcription Area */
        #display {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 20px; min-height: 350px; max-height: 500px;
            overflow-y: auto; font-size: 19px; line-height: 1.8; color: #e5e7eb;
            white-space: pre-wrap; outline: none;
        }
        .ghost-text { color: var(--primary); border-right: 2px solid var(--primary); font-style: italic; }

        .btn-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn {
            padding: 18px; border-radius: 14px; border: none; font-weight: 800;
            cursor: pointer; font-size: 14px; transition: 0.2s; color: white;
        }
        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); }
        .btn-util { background: #1f2937; }
        .btn:active { transform: scale(0.96); }

        .info { font-size: 11px; color: #6b7280; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <h1 style="margin:0; font-weight:900; letter-spacing:-1px;">FCBS <span style="color:var(--primary)">STUDIO PRO</span></h1>
            
            <div class="meter-box">
                <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:8px; font-weight:bold;">
                    <span>MIC SENSITIVITY (1000% BOOST)</span>
                    <span id="vol-text">0%</span>
                </div>
                <div class="bar-outer"><div id="bar-inner"></div></div>
            </div>

            <div id="display">Press 'START' and speak clearly...</div>

            <div class="btn-grid">
                <button id="ctrl-btn" class="btn btn-start" onclick="toggleMain()">🎤 START SESSION</button>
                <button class="btn btn-util" onclick="savePDF()">📄 PDF</button>
                <button class="btn btn-util" onclick="location.reload()">🔄 RESET</button>
            </div>

            <div class="info" id="status">STATUS: DISCONNECTED</div>
        </div>
        <p class="info">DIGI SOLUTIONS | TECHNOLOGY FOR TRINCO</p>
    </div>

    <script>
        let rec;
        let active = false;
        let finalText = "";
        let aCtx, analyzer, source, processor;

        // Initialize Speech Engine
        if ('webkitSpeechRecognition' in window) {
            rec = new webkitSpeechRecognition();
            rec.continuous = true;
            rec.interimResults = true;
            rec.lang = 'en-US';

            rec.onresult = (e) => {
                let interim = "";
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalText += e.results[i][0].transcript + " ";
                    } else {
                        interim += e.results[i][0].transcript;
                    }
                }
                const screen = document.getElementById('display');
                screen.innerHTML = finalText + '<span class="ghost-text">' + interim + '</span>';
                screen.scrollTop = screen.scrollHeight;
            };

            rec.onend = () => { if (active) rec.start(); };
            rec.onerror = (e) => console.log("Engine Error: ", e.error);
        }

        async function toggleMain() {
            const btn = document.getElementById('ctrl-btn');
            const status = document.getElementById('status');

            if (!active) {
                try {
                    // Start Audio Context (Crucial for "Length/Meter" to work)
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    aCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyzer = aCtx.createAnalyser();
                    source = aCtx.createMediaStreamSource(stream);
                    
                    // Boost Input Signal
                    const gainNode = aCtx.createGain();
                    gainNode.gain.value = 20; // 20x Boost
                    
                    source.connect(gainNode);
                    gainNode.connect(analyzer);
                    
                    startMeter();

                    if(finalText === "" || document.getElementById('display').innerText.includes("Press 'START'")) {
                        finalText = "";
                        document.getElementById('display').innerHTML = "";
                    }

                    rec.start();
                    active = true;
                    btn.innerHTML = "🛑 STOP SESSION";
                    btn.className = "btn btn-stop";
                    status.innerText = "STATUS: LISTENING @ 1000% BOOST";
                } catch (err) {
                    alert("Mic Access Denied! Settings වලින් Mic එක On කරන්න.");
                }
            } else {
                stopAll();
            }
        }

        function stopAll() {
            active = false;
            rec.stop();
            if(aCtx) aCtx.close();
            const btn = document.getElementById('ctrl-btn');
            btn.innerHTML = "🎤 START SESSION";
            btn.className = "btn btn-start";
            document.getElementById('status').innerText = "STATUS: STOPPED";
            document.getElementById('bar-inner').style.width = "0%";
        }

        function startMeter() {
            const data = new Uint8Array(analyzer.frequencyBinCount);
            const draw = () => {
                if (!active) return;
                analyzer.getByteFrequencyData(data);
                let sum = 0;
                for(let i=0; i<data.length; i++) sum += data[i];
                let vol = Math.round((sum / data.length) * 5); // Sensitivity Scaling
                if(vol > 100) vol = 100;
                
                document.getElementById('bar-inner').style.width = vol + "%";
                document.getElementById('vol-text').innerText = vol + "%";
                requestAnimationFrame(draw);
            };
            draw();
        }

        function savePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const val = document.getElementById('display').innerText;
            if(val.length < 2) return;
            
            doc.setFontSize(20);
            doc.text("FCBS LECTURE NOTES", 20, 20);
            doc.setFontSize(10);
            doc.text("Date: " + new Date().toLocaleString(), 20, 28);
            doc.line(20, 32, 190, 32);
            
            doc.setFontSize(12);
            const lines = doc.splitTextToSize(val, 170);
            doc.text(lines, 20, 45);
            doc.save("Lecture_Note.pdf");
        }
    </script>
</body>
</html>
