<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCBS SUPERSENSE | DIGI SOLUTIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #020617; --card: #0f172a; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; }
        .container { width: 95%; max-width: 800px; padding: 20px; }
        .card { background: var(--card); border: 1px solid #1e293b; border-radius: 24px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Volume Meter */
        .meter { height: 8px; background: #1e293b; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #a855f7); transition: 0.1s; }

        #output { 
            background: #020617; border: 1px solid #1e293b; border-radius: 15px; padding: 20px; 
            min-height: 450px; font-size: 22px; line-height: 1.7; color: #e2e8f0; 
            overflow-y: auto; white-space: pre-wrap; outline: none;
        }
        .interim { color: #818cf8; opacity: 0.6; font-style: italic; }

        .btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { padding: 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; color: #fff; transition: 0.2s; }
        .start { background: var(--p); }
        .stop { background: #ef4444; }
        .clear { background: #334155; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 style="margin:0; font-weight:900;">FCBS <span style="color:var(--p)">SUPERSENSE</span></h2>
        <p style="font-size:11px; color:#64748b; margin-bottom: 20px;">DIGI SOLUTIONS | PERSISTENCE MODE V3.0</p>
        
        <div class="meter"><div id="fill"></div></div>

        <div id="output" contenteditable="true">Ready. Tap 'START' to capture voice...</div>

        <div class="btns">
            <button id="mainBtn" class="btn start" onclick="toggle()">🎤 START</button>
            <button class="btn clear" onclick="clearText()">🗑️ CLEAR</button>
            <button class="btn" style="background:#1e293b" onclick="location.reload()">🔄 RESET</button>
        </div>
        <p id="st" style="text-align:center; font-size:10px; color:#475569; margin-top:15px;">STATUS: STANDBY</p>
    </div>
</div>

<script>
    let rec;
    let running = false;
    let final_script = "";
    let aCtx, anlyzr;

    if ('webkitSpeechRecognition' in window) {
        rec = new webkitSpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = 'en-US';

        rec.onresult = (e) => {
            let interim = "";
            // Clear current view and rebuild to prevent duplication
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                if (e.results[i].isFinal) {
                    final_script += e.results[i][0].transcript + " ";
                } else {
                    interim += e.results[i][0].transcript;
                }
            }
            document.getElementById('output').innerHTML = final_script + '<span class="interim">' + interim + '</span>';
            const b = document.getElementById('output');
            b.scrollTop = b.scrollHeight;
        };

        rec.onend = () => { if(running) rec.start(); };
    }

    async function toggle() {
        const b = document.getElementById('mainBtn');
        if (!running) {
            try {
                // High Gain Raw Audio Setup
                const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
                aCtx = new AudioContext();
                anlyzr = aCtx.createAnalyser();
                const src = aCtx.createMediaStreamSource(s);
                const g = aCtx.createGain();
                g.gain.value = 30; // Boost sensitivity
                src.connect(g); g.connect(anlyzr);
                
                mLoop();
                if(document.getElementById('output').innerText.includes("Ready")) {
                    document.getElementById('output').innerHTML = "";
                    final_script = "";
                }
                
                rec.start();
                running = true;
                b.innerText = "🛑 STOP";
                b.className = "btn stop";
                document.getElementById('st').innerText = "STATUS: LISTENING (HIGH SENSE)";
            } catch (err) { alert("Mic Access Denied!"); }
        } else {
            running = false;
            rec.stop();
            if(aCtx) aCtx.close();
            b.innerText = "🎤 START";
            b.className = "btn start";
            document.getElementById('st').innerText = "STATUS: STOPPED";
        }
    }

    function mLoop() {
        if(!running) return;
        const d = new Uint8Array(anlyzr.frequencyBinCount);
        anlyzr.getByteFrequencyData(d);
        let sum = 0;
        for(let i=0; i<d.length; i++) sum += d[i];
        let v = Math.min((sum / d.length) * 5, 100);
        document.getElementById('fill').style.width = v + "%";
        requestAnimationFrame(mLoop);
    }

    function clearText() {
        final_script = "";
        document.getElementById('output').innerHTML = "";
    }
</script>
</body>
</html>
